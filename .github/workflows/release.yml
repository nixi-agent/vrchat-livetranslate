name: Release

# 打 v* 标签 → 真打包一次（Windows 单文件 exe + Linux AppImage）→ 覆盖式发布到 Cloudflare R2
# （客户端主更新源，走公开域名复核）→ 建 Release 把两个附件都传上去。
# 为什么放 CI 而不是本机手工传：手工那次没人能复现「这个 exe / AppImage 到底是哪个 commit 打的」，
# 而这里 tag 与包内 __version__ 会先对一次账，产物还带 GitHub 服务端算的 SHA256。
# ⚠️ 顺序是**故意**的：R2 那步（publish-r2）是 release 的前置 —— R2 传不上去就整体红，
#    因为客户端 v0.12.0 起主要从 R2 收更新（详见 publish-r2 job 上方注释）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动跑一次只产出 artifact（不建 release）

permissions:
  contents: read

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里带 emoji/中文的 print
# 会 UnicodeEncodeError 直接打挂这一步（CI 上实测过 check_no_secrets.py 崩在「✅」）。
env:
  PYTHONUTF8: "1"

jobs:
  # ① Linux：AppImage（构建 + 独立验收）。
  #
  # 步骤本体在 `.github/workflows/appimage.yml` —— 与 CI 用的是**同一份**（系统依赖清单、
  # Tcl/Tk 版本进 cache key、构建→验收的顺序都只写一处；抄一遍迟早只改一处，#12 的教训）。
  # 这里拿到的 artifact 会在下面 `build` 里取回来，和 exe 一起当 Release 附件发出去。
  appimage:
    uses: ./.github/workflows/appimage.yml

  # ② Windows：单文件 exe + 组装 Release。
  #
  # ⚠️ `needs: appimage` 是**故意的**：宁可整体红，也不要静默发一个「只有 exe」的版本 ——
  #    Linux 用户照指南去附件里找 AppImage 却找不到，而这种「少了一半」不会有人报错。
  #    （仓库里同口径：发布路径上缺 Windows 独占依赖也要红灯，见下面的依赖门禁。）
  #    真要接受「AppImage 挂了也照发 exe」，把这个 needs 删掉即可。
  build:
    needs: appimage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # 打包脚本会读 git HEAD 做版本溯源

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"  # 与 README 要求一致（3.12 未测）

      - name: 对账 tag 与包内版本
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path vlt/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $py = $m.Matches[0].Groups[1].Value
          Write-Host "tag=$tag  包内 __version__=$py"
          if ($tag -ne $py) {
            Write-Error "tag 与 vlt/__init__.py 的 __version__ 不一致：先改代码再打 tag"
            exit 1
          }

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install "pyinstaller>=6.6"

      # ★ 依赖门禁：这是**真正发布**的路径，缺了 openvr / pyaudiowpatch
      #   会静默产出「没有 SteamVR 手腕屏、没有 VRChat 音频下拉」的 exe。
      - name: 断言 Windows 独占依赖可导入
        run: python -c "import openvr, pyaudiowpatch; print('Windows 独占依赖 OK')"

      - name: 打包单文件 exe
        # --no-verify：打完自带的自检要真 API key + 联网，CI 里没有 → 跳过
        run: python scripts/build_exe.py --no-verify

      # Linux 附件来自上面 `appimage` job（可复用 workflow 的产物）。
      # 单个文件的 artifact 里存的就是文件名本身 → 下到 dist/ 即 dist/xxx.AppImage。
      # ⚠️ 必须放在下面「自检产物」**之前**：那一步会断言 AppImage 已经在 dist/ 里
      #    （第一次跑就是顺序错了，在 fork 上实测到「没找到 Linux 附件」→ 这一步炸）。
      # ⚠️ `download-artifact` 的 major 要与 appimage.yml 里 `upload-artifact` 的 major 配对
      #    （现在两边都是 v4）：跨 major 取不到东西，而这一步只在打 tag 时才跑，容易没人发现。
      - name: 取回 AppImage 产物（Linux 附件）
        uses: actions/download-artifact@v4
        with:
          name: VRChatLiveTranslate-AppImage
          path: dist

      - name: 自检产物（存在性 / 大小）
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没找到产物 $exe"; exit 1 }
          $f = Get-Item $exe
          Write-Host ("产物：{0}  {1:N1} MB" -f $f.Name, ($f.Length / 1MB))
          if ($f.Length -lt 20MB) { Write-Error "产物体积异常（<20MB），大概率没打全"; exit 1 }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()

          # Linux 附件必须**真的在这儿**：`needs: appimage` 只保证那个 job 成功，
          # 取回来这一步要是没落进 dist/，就得在这里炸掉，而不是发一个只有 exe 的 Release。
          $img = "dist/VRChatLiveTranslate-x86_64.AppImage"
          if (-not (Test-Path $img)) { Write-Error "没找到 Linux 附件 $img（appimage job 的产物没取回来？）"; exit 1 }
          $i = Get-Item $img
          Write-Host ("产物：{0}  {1:N1} MB" -f $i.Name, ($i.Length / 1MB))
          # ⚠️ 下限 30MB（原为 40MB）：2026-10 Linux 侧彻底去掉 PortAudio/sounddevice
          #    （麦克风走原生 pw-record），AppImage 从约 40.2 MiB 降到约 39.5 MiB，
          #    40MB 这条线会把正常产物判成「没打全」（v0.10.0 第一次打就是这么红的）。
          #    真正的完整性由 appimage job 的 scripts/verify_appimage.py（模块对账 +
          #    平台纯度 + 离线渲染）负责；这里只是一道「别把半截文件发出去」的体积哨兵。
          if ($i.Length -lt 30MB) { Write-Error "AppImage 体积异常（<30MB），大概率没打全"; exit 1 }
          $img_hash = (Get-FileHash $img -Algorithm SHA256).Hash.ToLower()

          # ⚠️ SHA256SUMS.txt 是**给用户看的校验值清单**：GUIDE 让用户拿它核下载物，
          #    所以 **exe 与 AppImage 各一行**（2026-10 起；AppImage 的 sha256 以前只写在
          #    latest.json 里 → Linux 用户照文档核不了）。发布侧 `publish_r2.py` 有门禁：
          #    这个文件若在，两行必须与真实产物逐项一致且**不许有 CR**，否则不发版。
          #    ★ 行尾必须是 LF：`Out-File` 在 Windows runner 上写 CRLF，Linux 侧
          #      `sha256sum -c SHA256SUMS.txt` 会把 "\r" 当成文件名的一部分 → 全部“找不到文件”。
          #      这份文件就是给 Linux 用户核对用的，所以走 WriteAllText 显式写 LF。
          #    （格式：`<sha256>  <附件名>` 两列、空白分隔；客户端按附件名逐行找，多余行忽略。）
          $sums = "$hash  VRChatLiveTranslate.exe`n$img_hash  VRChatLiveTranslate-x86_64.AppImage`n"
          [System.IO.File]::WriteAllText((Join-Path $PWD "dist/SHA256SUMS.txt"), $sums,
                                         [System.Text.Encoding]::ASCII)
          Write-Host ("sha256：exe={0}  appimage={1}" -f $hash, $img_hash)

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # ③ Cloudflare R2：覆盖式发布到公开下载域 + **走公开域名复核**（客户端主更新源）。
  #
  # 为什么这一步要卡在 Release 前面（下面 `release.needs` 里带着它）：
  # 客户端 v0.12.0 起**主更新源是 R2 上的 latest.json**（GitHub 只作兜底）。R2 没传成功就等于
  # 「发了版但没人收得到更新」—— 这种「看起来发成了」的失败必须整体红，宁可晚发一次。
  # 真要接受「R2 挂了照发 Release」，把这个 needs 去掉即可（客户端会回落到 GitHub 源）。
  #
  # 键固定、对象带 no-cache（理由与实测见 scripts/publish_r2.py 头部）：
  #   latest.json / VRChatLiveTranslate.exe / VRChatLiveTranslate-x86_64.AppImage / SHA256SUMS.txt
  publish-r2:
    needs: [build, appimage]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # 两个 artifact 都下到 dist/：与 release job 取附件的方式一致
      - name: 取回 exe 产物
        uses: actions/download-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: dist
      - name: 取回 AppImage 产物
        uses: actions/download-artifact@v4
        with:
          name: VRChatLiveTranslate-AppImage
          path: dist

      - name: 装 boto3（R2 的 S3 端点）
        # 锁一个范围而不是裸装最新（评审 §8）：发布链路每次现装 latest 等于把「今天的最新版」
        # 当依赖，哪天上游不兼容就直接卡在发版上。大版本不出 2 就不换口径。
        run: python -m pip install "boto3>=1.34,<2"

      # 一条命令干完：算 sha256 → 生成 latest.json → 上传 4 个对象 → **把两份产物整份下回来
      # 逐字节复核**。复核不通过 → 非 0 退出 → 这一步红 → release job 不会跑。
      - name: 发布到 R2 并复核公开域名
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/publish_r2.py publish --dist dist --tag "${GITHUB_REF_NAME}"

  release:
    needs: [build, appimage, publish-r2]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: VRChatLiveTranslate-exe
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: VRChatLiveTranslate-AppImage
          path: dist
      - name: 建 Release 并附上 exe + AppImage
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          # ⚠️ 关掉自动附加的「What's Changed / New Contributors」（用户 2026-09 明确要求）：
          #    说明**只留「这版有什么」**这一段，自动附的那两节与 Full Changelog 都不要。
          #    所以每个版本都必须手写上面这段 body —— 别指望 GitHub 替你列 PR。
          generate_release_notes: false
          body: |
            ### 这版有什么

            **修复**

            - 非翻译模式下勾选「手腕屏」没有面板：锚点设备（手柄 / 追踪器）或头显尚未被追踪时，旧代码判死整块面板并退回勾选；现改为保留面板并每秒重试贴锚点，设备就绪后面板自行出现 — #98 @nixi-agent
            - 「手腕屏」内容比桌面字幕延迟数秒：D3D11 共享贴图上传后缺少 `Flush()`，绘制命令滞留于 CPU 侧缓冲、合成器恒读到上一帧；现上传后立即提交 — #98 @nixi-agent
            - 「麦克风代理」首次说明每次启动都弹：去重标记写不进早期模板生成的 `config.yaml`（`output.audio` 下没有 `proxy:` 段时静默 no-op）；同一根因下「麦克风代理」勾选框与直通缓冲滑块同样无法落盘 — #98 @nixi-agent

            **其它**

            - 面板整体不可用后的自愈改为 5 秒 → 60 秒退避重试；取消勾选后已排定的重试不再重建面板 — #98 @nixi-agent
            - 手腕屏心跳日志标明走「持久贴图」还是兼容旧路 — #98 @nixi-agent

          files: |
            dist/VRChatLiveTranslate.exe
            dist/SHA256SUMS.txt
            dist/VRChatLiveTranslate-x86_64.AppImage
          fail_on_unmatched_files: true
