# ⚠️ 这是**模板**，不是你在用的配置。
#
# 首次运行会把它复制成 config.yaml，之后你在界面上的改动（设备选择、语言等）
# 都写进 config.yaml，而 config.yaml 已被 gitignore、不会进版本库
# （设备名这类配置因机器而异，跟着仓库走只会互相污染）。
#
# 想重新来一份：删掉 config.yaml 再启动即可。
#
# ---------------------------------------------------------------
# VRChat 实时同传 —— 主配置
# 模型与目标语言都在这里改，不需要动代码（适配层按 model 自动分派事件）。

session:
  # 默认 3.8；可换 qwen3.5-livetranslate-flash-realtime（字段/事件自动切换）
  model: qwen3.8-livetranslate-flash-realtime
  # 服务线路（互斥）：qianwen = 千问云（国内，默认）；qwencloud = 千问云·海外版（qwencloud.com）
  # ⚠️ 实际连接地址一律以 base_url 为准；切线路请在界面「⚙ 设置 → 常规」里切（会同步改写 base_url）
  # ⚠️ 两条线路的 API key **不互通**：界面按线路分槽各存一份
  #   （api_key.txt / api_key_qwencloud.txt），来回切线路不用重填。
  provider: qianwen
  # 千问云（默认）：国内线路，免业务空间 ID、无地域段；
  # 千问云·海外版会被界面写成 wss://maas.qwencloudapi.com/api-ws/v1/realtime
  base_url: wss://maas.qianwenaiapi.com/api-ws/v1/realtime
  # ⚠️ 必须显式指定：不填会抛 Voice 'Chelsie' is not supported（纯文本模式也校验）
  # 这是「说话译音」的音色（实时模型直出）；也可在界面「⚙ 设置 → 音色」里选。
  # 音色 id 按模型区分，不能与下面 text_input.tts 的音色表混用。
  voice: Tina
  # 断句：留空 = 用服务端默认（3.8 为 speaker_detection）；也可填 server_vad
  # 实测（2026-10-01，4 轮真链路）：填 server_vad 会让**首条译文更早出现**
  #   短句：开口后 1.19~1.23s → 0.57~0.69s（早 ~0.6s）
  #   长句：开口后 3.29~3.35s → 2.30~2.48s（早 ~0.9s）
  # ⚠️ 代价：server_vad 按**静音**判停，speaker_detection 认「谁在说」→ 环境嘈杂、或你中途
  #    停顿较久时，更容易在句子中间断句（译文被切成更多小段）。吵的环境建议留空。
  turn_detection: null
  # 静默兜底：服务端在持续音频下可能长时间不发 response.done，
  # 超过这个静默时长就把累计文本当最终版发出（保证「句末刷最终版」必达）。
  # ⚠️ 必须大于服务端的增量间隔（实测连续说话时相邻 delta 最大 2.3s）——
  #    调小会在句子中间抢跑，把半句话当成最终版。
  final_silence_s: 3.0
  # 快封句（2026-10-01 实测新增）：**上游也没人说话了**（说的人确实说完了）时，
  # 文字静默 fast_final_silence_s 就封句，不必再等那 3s。实测：服务端在人停止说话后
  # 8s 内一条事件都不发（无 text.done / 无 response.done），而累计译文在
  # 「说完前 0.7~0.9s」就不再增长 → 之后全是白等。
  # 判据是**电平**：本机采集到的音频峰值超阈（有人在说）就会一直刷新「有人说话」时刻；
  # 上游安静超过 fast_final_user_quiet_s 且文字静默超过 fast_final_silence_s 才早封。
  # 人还在说时（上游安静 < fast_final_user_quiet_s）仍用上面的 3.0s —— 那 2.3s 的大间隔
  # 是**句子中间**的停顿，不能当证据。
  # ⚠️ 已知限制：环境噪声长期高过电平阈值 → 「上游安静」永远不成立，快路径自动退化成
  #    原来的 3.0s（保守方向，不抢跑）；想更早封把这两个值调小，想完全关掉写 null。
  fast_final_silence_s: 1.1
  fast_final_user_quiet_s: 0.5
  # RPM 10 预算：每次 WS 连接算一次请求
  max_new_sessions_per_minute: 4
  reconnect_backoff: [2, 5, 10, 30]
  # ---- 长静音闸门（治服务端「model repeat output happened」掉线）----
  # 实测：静音块占比经常 60~80%，模型被静音喂久了会进入重复输出状态，服务端报错后掐线。
  # 连续静音超过 silence_gate_after_s 就暂停上送音频；闸住期间只保留最后
  # silence_gate_preroll_s 秒，声音恢复时先补发这段 preroll —— 句首不丢。
  # 取舍：调小 after_s 更护模型，但正常说话中的长停顿（想词、等人）也会被闸，
  #       恢复时靠 preroll 补句首；preroll 太短可能丢句首低能量部分，太长则多送旧静音。
  silence_gate_enabled: true
  silence_gate_after_s: 30
  silence_gate_preroll_s: 1.0
  # ---- 本地 repeat 抑制（模型重复吐同一句时的最后防线）----
  # 连续 repeat_guard_hits 条最终译文相似度 ≥ repeat_guard_ratio → 判为 repeat：
  # 不再往 chatbox / 手腕屏刷（对方不该看到「对对对对对」），并主动重建会话。
  # 判定故意保守（短于 4 字的终版不参与，「好」→「好的」不会误判）；误杀的代价
  # 是一次重连，漏判的代价是对方看你刷屏 —— 默认值偏向后者。
  repeat_guard_enabled: true
  repeat_guard_hits: 3
  repeat_guard_ratio: 0.9

# 音频设备选择（空字符串 = 自动检测，也可在界面下拉里选）
# 两端的设备名来源不同：
#   Windows → WASAPI 设备的名字（如 "Steam Streaming Speakers (loopback)"）
#   Linux   → PipeWire 输出节点的 description（如 "REDMI 电脑音箱 2 Pro 模拟立体声"）
capture:
  mic_device: ""            # 麦克风设备名；空 = 自动检测（默认设备）
  loopback_device: ""       # 「别人说话」的采集端点；空 = 自动回退链
                            # Linux 上就是 VRChat 输出到的那个 sink（见 GUIDE.linux.md 第六节）
  # ---- 输入门限（只作用于 VRChat 输出 = 「别人说话」那条腿）----
  # 治什么：VRChat 把人声混成一路输出，远处玩家声音小、本来就听不清，以前照样被送给
  # 模型 → 白花钱还容易被翻成乱话。开启后按**每 100ms 块的 RMS 响度**（不是峰值：
  # 峰值会被按键/音效的单个尖刺骗开）判：低于 gate_db 的块不上送，模型听不到 = 不翻译。
  #   gate_db 越高（越接近 0）= 过滤越狠，只留贴近耳边的人；越低 = 越宽松。
  #   参考：近处正常说话大致落在 -30 ~ -20 dBFS，远处小声的常在 -50 以下。
  # gate_hold_ms：一旦超过门限，之后这段时间内即使回落到门限以下也继续送 ——
  #   说话句中的停顿、句尾渐弱不会被切碎（调小会更"干净"，但句子容易断）。
  # gate_preroll_ms：开闸时补发越阈值之前的一小段 —— 句首辅音不丢（识别少掉字）。
  # 界面「⚙ 设置 → 输入门限」里有滑块 + 实时电平条，可以边放歌边拖到合适位置。
  # 只影响「听别人」这条腿；麦克风（自己说话）不受影响。
  gate_enabled: true
  gate_db: -45.0
  gate_hold_ms: 500
  gate_preroll_ms: 250

# 每个方向一条独立会话
directions:
  # ① 我说 → chatbox（对方看得见，我自己也看得见）
  mine:
    source_lang: zh
    target_lang: en          # 可改 ja / ko / fr / de / es / ru / th ...
    output_audio: false      # true 则同时拿译音（走虚拟声卡那条腿）
    hotwords: {}             # 方向级热词（可选）：只对**这个方向**生效，覆盖下面 glossary 的同名词条
                             # 例：{"Nekoya": "Nekoya"} —— 我说英文名、英文译文保持原样
  # ② 别人说 → 手腕屏
  theirs:
    source_lang: null        # null = 自动识别（多国玩家场景）
    target_lang: zh
    output_audio: false
    hotwords: {}             # 例：{"Nekoya": "猫屋"} —— 对方念英文名、中文译文用中文名

# ---------------------------------------------------------------
# 专有词库：把社团名 / 人名 / 术语**钉死**成你要的写法。
# 说话那条腿 → 实时会话的热词；打字那条腿 → Qwen-MT 术语干预。
#
# ⚠️ 它是**给模型的提示（术语干预）**，不是字符串替换：模型会尽量按你给的译名走，
#    但搭配由模型处理（`Nekoya Studio` 会译成「猫屋工作室」）；模型自己音译出的写法
#    （如「尼可亚」）不会被改写，那种要把该写法也写成一条。
#    附带好处：key 同时也是**识别热词**，能纠正听写（实测 Nekoya 不再被听成 Nikoya）。
#
# 写法：`原文: 译名`。「原文」按**源语言**里的实际写法填。
#
# ⚠️ 这个 `glossary` 是**全局**的，会同时作用到两个方向。两个方向的目标语言不同，
#    所以只放「两个方向都要同一个译名」的词（如 VRChat 保持原样）。
#    只在某一个方向成立、或两向需要**不同**译名的词条，放上面 `directions.<方向>.hotwords`：
#        mine.hotwords:   {"Nekoya": "Nekoya"}    # 我说 → 英文：保持原样
#        theirs.hotwords: {"Nekoya": "猫屋"}      # 别人说 → 中文：用中文名
#    放错的后果（实测）：全局写 "Nekoya": "猫屋"，则「我说 → 英文」的译文会变成
#        I come from the Cat House club.          # 社团名被换掉了
# 界面入口：⚙ 设置 → 专有词库（一行一条 `原文=译名`）。界面上那行「作用方向」下拉
#   可以切三张表：`全局`（就是下面这段）/ `我说`/`别人说`（写上面 directions.<方向>.hotwords）。
#   保存只动当前选中的那一张，不会碰另一张。
# 段内注释会被界面保存时整段覆盖 —— 要写说明请写在本段**上方**（就像现在这样）。
glossary:
  "VRChat": "VRChat"
  "逆袭": "Nixi"

chatbox:
  host: 127.0.0.1
  port: 9000                 # VRChat 的 OSC 接收端口（也可在「设置 → 常规 → VRChat OSC」里改）
  max_chars: 144             # 官方上限（字符，不是字节）
  max_lines: 9
  interval_s: 2.0            # 增量刷新节奏（漏桶 5 条/5 秒 → 2 秒一条余量充足）
  bucket_capacity: 5
  bucket_window_s: 5.0
  min_gap_s: 0.4
  notification_sound: true

merger:
  interval_s: 2.0            # 首个 delta 立即发，之后每 2 秒一次快照，句末必刷最终版
  carry_over: false          # true = 把上一段最终译文作为前缀保留（连续字幕观感）

# 手腕屏幕（Windows: SteamVR overlay / Linux: 自建 OpenXR overlay）
overlay:
  enabled: true
  # 后端：auto = 按平台自动选（Windows 用 pyopenvr；Linux 用自建 OpenXR，直接连
  # Monado/WiVRn，不依赖任何第三方 overlay 管理器、无需注册、不写配置、不重启）。
  # null = 彻底禁用这一条腿（等价于 enabled: false，但语义更明确）。
  backend: auto
  # 刷新策略：0 = 有更新立刻上屏（本地显示不受 chatbox 2 秒节流约束，默认如此）
  #            >0 = 按秒数节流（怕刷太快看着晃时才调，例如 0.5）
  interval_s: 0
  # 锚点 = 面板挂在什么上：右手 / 左手 / 外部 tracker / 头显前固定
  anchor: right_hand         # left_hand | right_hand | tracker | hmd
  # anchor=tracker 时取第几个 tracker。
  # ⚠️ 这个锚点跟「前臂」**没有绑定关系** —— 它就是「第 N 个通用 tracker」
  #    （把 tracker 绑在前臂/手腕上只是为了离手腕近、看着像块腕表）。而且两端寻址
  #    口径不同，序号含义**不可移植**：
  #      Windows —— 第 N 个**已配对在线**的 GenericTracker（驱动注册 ≠ 已配对；
  #                 一个都没找到时**静默回落右手**，界面上不会有任何提示）
  #      Linux   —— HTC 的 role 表序号：0=右腕 1=左腕 2=右肘 3=左肘 4=胸 5=腰
  #                 6=右脚 7=左脚（按 role 寻址，不是按设备序号；该表未在真实
  #                 tracker 上验证过）
  tracker_index: 0
  # ★ 每个锚点各存一套位姿：界面上切锚点会自动载入对应这一份，各改各的、互不覆盖。
  #   「设置 → 手腕屏」里拖的就是**当前锚点**这一份，改完存盘即热重载（无需重启）。
  #   ⚠️ 左右手的 grip 坐标系沿 X 轴镜像，所以**左手不能照抄右手**：
  #      rx 不变、ry 取反、rz 取反（位置的 x 分量同理）。下面 left_hand 那份已经按
  #      这条规则镜像好了（默认 pos 的 x 是 0，看不出差别），戴着再微调即可。
  offsets:
    right_hand:
      pos: [0.0, 0.06, 0.02]
      rot: [-47, -16, 0]
    left_hand:
      pos: [0.0, 0.06, 0.02]
      rot: [-47, 16, 0]
    tracker:
      pos: [0.0, 0.06, 0.02]   # 相对 tracker 的偏移：起点同右手腕，绑前臂时再微调
      rot: [-47, -16, 0]
    hmd:
      pos: [0.0, -0.10, -0.35] # 头显正前方 35cm、略低于视线
      rot: [0, 0, 0]
  # 兜底：某个锚点在上面没有单独存过时用这一份（老配置只有这一段也照常工作，
  # 不会因为升级就丢掉已经调好的位姿）。
  # width_m / curvature / alpha 是**面板本身**的属性，所有锚点共用，所以留在这里。
  offset:
    pos: [0.0, 0.06, 0.02]   # 相对锚点偏移（米）——改完存盘即生效，无需重启
    rot: [-47, -16, 0]       # 欧拉角（度，约定 Rz·Ry·Rx）——默认值取自作者实测调好的**右手腕**角度
                             # ⚠️ 换到左手要镜像：rx 不变、ry 取反、rz 取反
                             #    即 left_hand 用 [-47, 16, 0]（起始值，再戴着微调）
    width_m: 0.23            # 面板宽度（米）—— 弯曲时按**弧长**算，与 Windows 一致
    curvature: 0.0           # 弯曲：占整圆的比例（与 SteamVR/Windows 同一口径：
                             #   curvature = 宽度 / (2π·半径)；0.5 = 半圈 180°）。
                             # 0 = 平面；0.1~0.3 是手腕屏比较好看的区间。改它只弯曲、
                             # 面板中心不动（两边朝你卷）。
    alpha: 0.9               # **整层**透明度乘子（0~1）：底板和文字一起乘。
                             # Windows = SteamVR 的 setOverlayAlpha；Linux = 自己乘进贴图
                             # alpha 通道（OpenXR 没有对应的 API）。想让"底板淡、文字实"，
                             # 调下面的 bg_alpha，别动这里。
  size_px: [1024, 440]       # 面板像素尺寸（[宽, 高]；界面「面板高」滑块改的就是这个高）
  font: "C:/Windows/Fonts/msyh.ttc"   # 雅黑；日文可用 NotoSansJP-VF.ttf
                             # ⚠️ 这是 **Windows** 路径。解析规则两端一样：填**存在的绝对路径**
                             #    就用它（Linux 例：/usr/share/fonts/noto-cjk/NotoSansCJK-Regular.ttc）；
                             #    路径不存在（或留空）→ **静默回落**到平台自动探测 ——
                             #    Linux 走 fontconfig（`fc-match`），Windows 用雅黑候选表。
                             #    ⇒ Linux 上留空即可（写这条 Windows 路径没意义：文件不存在）。
                             #    只有「fontconfig 里一套中日韩字体都没有」时才会退到位图字体，
                             #    那时才画不出中文。
  font_size: 36              # 译文字号（「设置 → 手腕屏」里可拖；调小 → 同样高度能塞更多字）
  source_font_size: 29       # 原文小字号（同上）
  max_lines: 3               # 译文最多显示几行（超出保留最新）
  show_source: true          # 双行显示：原文 + 译文（3.8 默认就返回源文识别结果，零额外成本）
  fade_after_s: 0.0          # >0 则静默这么久后淡出
  # 配色：统一白色系，层级只靠字号 + 透明度区分（不靠换色，避免像残留色）
  color_translation: [255, 255, 255]
  color_source: [255, 255, 255]
  source_alpha: 205          # 原文透明度 0-255（150 会显灰，像另一个颜色）
  color_border: [110, 170, 205]
  border_alpha: 120
  color_bg: [12, 14, 20]
  bg_alpha: 205              # 底板不透明度 0-255：面板要"透着看场景"就调小这里
                             # （界面上「底板不透明度 / 原文不透明度」两个滑块改的就是它俩；
                             #   想让文字更实心就把 source_alpha 拉满 255）
  separator: true            # 原文/译文之间的细分隔线

# 桌面字幕（**PC 桌面模式**用：把译文像歌词一样贴在 VRChat 窗口上）
#
# 与上面的 `overlay:` 是两条独立的腿：`overlay:` = 头显里的手腕屏（要 SteamVR / OpenXR），
# 本段 = 普通显示器上的一块无边框叠加窗（不需要头显，桌面模式玩家用这个）。
#
# ⚠️ **两段配置完全独立、互不影响**：本段自带一整套视觉键（字体 / 字号 / 配色 / 行数 /
#    是否显示原文 / 面板尺寸）。改 `overlay:` 段**不会**动到桌面字幕，反之亦然 ——
#    桌面面板是屏幕上的像素面板（单位 px），手腕屏是 VR 里的贴图（单位米），本就不是一回事。
#    本段没写的键 → 用程序的**代码默认值**（观感与手腕屏的默认值一致），不是抄 `overlay:` 段。
#    可写在本段的视觉键：font / font_size / source_font_size / max_lines / show_source /
#    color_translation / color_source / source_alpha / color_border / border_alpha /
#    color_bg / bg_alpha / color_mine / color_theirs / separator / fade_after_s
#
# 开了之后：勾选界面上的「桌面字幕」，字幕窗会立刻出现；**它旁边有自己独立的调整入口**
# 「桌面字幕调整 ▸」（译文字号 / 原文字号 / 面板宽度 / 面板高度 / 透明度 / 解锁拖动），
# 拖完即时生效。鼠标穿透是默认开的（不挡你点 VRChat），要拖动得先解锁。
#
# 后端（`backend`）：Wayland 会话（niri / sway / Hyprland / KDE 等实现了 layer-shell 的
# 合成器）自动用**原生 layer-shell 窗**；X11 会话（含带 XWayland 的 GNOME/Weston）用
# **原生 ARGB 覆盖窗**——两者都是逐像素透明（真圆角、底板半透明）、置顶、协议级鼠标穿透。
# X11 的透明需要合成器（picom 等）：没检测到时会自动降级用 1 位形状蒙版裁掉透明区
#（没有黑框；圆角为锯齿、底板是实色），启动日志有一行说明。
# 两条原生腿都建不起来时回落到 Tk 窗（Windows 靠色键透明；Linux 会用 1 位形状蒙版
# 抠掉面板外的键色底，但做不到逐像素半透明）。
desktop_overlay:
  enabled: false             # 总开关（界面上的勾选状态存在 ui.desktop_overlay，两边都认）
  mode: conversation         # conversation=镜像聊天区（最近几条，带说话人侧边条）
                             # latest=只显示最新一句（更像歌词）
  backend: auto              # auto=有原生就用（Wayland→原生 layer-shell）| native=显式要求原生
                             #   （回落 Tk 时留一行警告）| tk=强制 Tk | wayland / x11=强制指定
                             #   某一原生后端（建不起来自动回落 Tk 并留日志；启动时生效）
  attach_to_game: true       # true=贴在 VRChat 窗口上并**跟随**它的移动/缩放
                             #      找不到窗口时自动退化成 pos 的绝对屏幕坐标（会留日志）
  game_title: VRChat         # 目标窗口标题（不区分大小写的子串匹配）
  anchor: bottom_center      # 贴窗时的锚点：top_left/top_center/top_right
                             #              middle_left/center/middle_right
                             #              bottom_left/bottom_center/bottom_right
                             #              free = 不贴窗口，用下面的 pos 定位
  offset: [0, -48]           # 相对锚点的像素偏移（负 y = 往上）（拖动后由界面写回这里）
  pos: [80, 80]              # **屏幕绝对坐标**（不是窗口相对坐标）：attach_to_game=false、
                             # anchor=free、或找不到目标窗口时用它定位。多屏时副屏在主屏
                             # 左侧/上方的话，这里可以是负值。
  size_px: [1024, 360]       # 面板像素尺寸（**只归本段**；界面「桌面字幕调整 ▸」里有宽/高滑块）
  alpha: 0.90                # **整窗透明度**（0.2~1.0）—— 同一处滑块改的就是它
  font_size: 36              # 译文字号（px）—— 4K 屏上嫌小就往上调（字号/面板一起看）
  source_font_size: 29       # 原文小字号（px）
  click_through: true        # 鼠标穿透（点字幕窗会点到 VRChat 上）；拖动的瞬间自动临时关掉
  follow: true               # VRChat 窗口移动时跟着走

# 第三条腿：译音输出（模型译音 → 虚拟声卡 → VRChat 麦克风 → 对方听到）
output:
  audio:
    enabled: false           # 总开关（与 direction 的 output_audio 是「与」关系——两边都 true 才出声）
    # ⚠️ 下面这条回退链是 **Windows 专用**（VB-Cable / VoiceMeeter 这类**事先装好**的虚拟声卡）。
    #    Linux 上**不用配**：程序运行时会自己声明一对 PipeWire 节点
    #    （`vlt_mic_sink` / `vlt_mic_source`，VRChat 里选显示名 "VLT Mic"），退出时自动销毁。
    device:                  # 按名称回退链找虚拟声卡（设备 ID 会随插拔变化，绝不写死）
      - "voicemeeter input"
      - "voicemeeter aux input"
      - "cable input"
      - "vb-audio"
    device_name: ""          # 用户手选的译音输出设备名；非空时优先于上面的回退链
    sample_rate: 48000       # VRChat / VoiceMeeter 统一要 48k
    buffer_ms: 300           # 起播前先攒这么多，避免断续（界面「设置→音频」可调）
    max_buffer_ms: 2000      # 排队上限：超了就**整句**丢弃最旧的（绝不从句中切断，正在播的那句不丢）
    # 麦克风代理（**两端都支持**）：程序一启动就把真实麦克风直通到虚拟声卡，VRChat 里
    # 麦克风永久固定选虚拟声卡（Windows = VoiceMeeter/VB-Cable，Linux = 程序自己声明的
    # 「VLT Mic」），改「原声/译音」在界面一键切，不必再去 VRChat 里换麦克风。
    proxy:
      enabled: true            # 关掉 = 回到旧行为（引擎自建译音输出，界面切换开关置灰）
      passthrough_buffer_ms: 150  # 原声直通的缓冲容量：越大越不易断续、但延迟越高。
                                  # ⚠️ 下限 60ms——麦克风输入块约 100ms，太小会把每块削掉大半。
      hint_shown: false        # 「首次启用说明已弹过」标记：程序自己维护（见 vlt/gui_proxy_hint），
                               # 用户不用管；写成 true 就不会再弹那条说明。

# 打字输入（不想开麦时用键盘代替说话：界面下方输入框 + 回车发送）
#
# 打字走的是**文本翻译**接口，不是实时语音那条会话 —— 实测实时模型不接受文本入口
# （发 response.create 会被回 invalid_value）。所以这里单独配一个文本翻译模型。
text_input:
  enabled: true              # false = 界面不显示打字输入行
  # 默认 qwen-mt-flash。别换成 qwen3-livetranslate-flash：实测它的**文本**接口
  # 会原样回吐（中文进、中文出；换个句子又正常），行为不可依赖。
  model: qwen-mt-flash
  timeout_s: 20              # 单次翻译超时（秒）
  # 打字也要出声（进虚拟声卡 → VRChat 麦克风 → 对方能听到）
  # 生效条件：上面「输出」里勾了「译音输出」（或 output.audio.enabled=true）且方向含「我说」。
  # 没开译音时这一步自动跳过，只出文字。
  tts:
    enabled: true
    model: qwen3-tts-flash   # 也可换 qwen3-tts-instruct-flash
    voice: Cherry            # 多语言音色（中/英/日实测都能读）；界面「⚙ 设置 → 音色」可选
    stream: true             # 流式合成（SSE）：首段音频 ~0.5s 就能起播；false = 等整段（~1.7s 才开口）
    timeout_s: 30
    reuse_conn: true         # 复用同一条 HTTPS 连接：连续多段省一次 DNS+TCP+TLS（实测后段省 94~186ms/段）。
                             # false = 每次新建连接（与旧行为完全一致，出问题可先关掉它定位）

# ---- 房间：多人各自跑 VLT 时互相看字幕（默认关，不影响现有单机用法）----
# 场景：几个都装了 VLT 的人一起玩，语音通道被本地玩家占掉时，房间内改用文字互通。
# 广播的是**各自的 ASR 源文**（本期不做翻译）；房间链路出任何问题只报状态，
# 绝不拖垮现有的翻译 / chatbox / 手腕屏。
room:
  enabled: false
  server_url: "wss://vlt-room.kcm-nixi.cn/ws"
  room_code: ""            # 8 位，两端必须一致（不含 I/L/O/U）
  nickname: ""             # 空 = 用系统用户名
  token: ""                # 服务端开了门禁才需要
  broadcast_source: true   # 把「我」说的话发到房间
  show_remote: true        # 把别人说的话显示在手腕屏
  max_peers: 8
  reconnect_backoff: [2, 5, 10, 30]
  heartbeat_s: 20

# 界面（图形界面上次的选择，**启动时自动恢复**；手改也有效）
ui:
  direction: mine          # mine=我说的话 | theirs=别人说 | dual=双向同时
  # 界面缩放：auto（默认）=跟随系统 DPI（HiDPI 下字号与窗口一起放大）；
  # 写数值 = **强制整个界面按该倍数缩放**（字号 + 窗口，忽略系统 DPI），如 1.25 / 1.5 / 2.0；
  # 1.0 = 强制 100%（HiDPI 屏上会明显变小，一般别设）。
  scale: auto
  chatbox: true            # 输出勾选：chatbox 气泡（翻译进行中勾选/取消即时生效，不重建会话）
  chatbox_text: translated # chatbox 气泡显示什么：translated=译文（默认）| source=原文（ASR 识别结果）
  overlay: false           # 输出勾选：手腕屏（需要 SteamVR 在跑）
  desktop_overlay: false   # 输出勾选：桌面字幕（PC 桌面模式，贴在 VRChat 窗口上）
