name: CI

# 每次推 main / 开 PR 都跑一遍：语法、静态检查、凭据扫描、全部离线测试（含覆盖率摘要），
# 最后确认「还打得出来 exe」。
# 所有测试都必须能在没有 API key、没有麦克风/VRChat/SteamVR 的机器上跑（CI 就是这么台机器），
# 需要真 key 的 --self-test 不在这里跑（它在 release.yml 里也显式跳过）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支 / PR 的旧运行让位给新运行：避免「上一次卡死还没结束、新的又排队」一直占着
# （本仓库真踩过：一个 run 卡到默认 6 小时超时）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ⚠️ 必须开 UTF-8：Windows runner 的 stdout 默认是 cp1252，脚本里一句带 emoji/中文的 print
# 就会 UnicodeEncodeError 把整步打挂（实测：check_no_secrets.py 的「✅」直接崩了 CI）。
# Python 3.7+ 的 UTF-8 模式让 stdout/stderr 与 open() 默认都走 UTF-8，一次覆盖所有步骤。
env:
  PYTHONUTF8: "1"

jobs:
  tests:
    runs-on: windows-latest
    # 兜底：卡死时 30 分钟内红掉，而不是耗到 GitHub 默认的 6 小时（本仓库真踩过）
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install -r requirements-dev.txt

      # ★ 依赖门禁：这几个是 **Windows 独占**依赖，缺了不会报错，只会静默少两条腿
      #   （openvr 没了 → SteamVR 手腕屏 unavailable；pyaudiowpatch 没了 →
      #    设备枚举抛异常被 devices.py 吞成空列表，「VRChat 音频」下拉空空如也）。
      #   这正是 PR #4 审查发现的漏检类型（文件写对了、没人装），所以做成红灯门禁。
      - name: 断言 Windows 独占依赖可导入
        run: python -c "import openvr, pyaudiowpatch; print('Windows 独占依赖 OK')"

      - name: 语法检查（不导入，只编译）
        run: python -m compileall -q vlt scripts tests

      # ★ 静态检查门禁（**阻断**）：只跑 F,E9 这一档，规则固化在 ruff.toml。
      #   它专抓「真会出问题」的一类：F821（用到未定义名）在本仓库真实造成过
      #   **静默降级** —— vlt/platform/win.py 的 screen_work_area() 第二条回落分支
      #   写错常量名、恒抛 NameError 被吞，于是永远返回硬编码 1920x1080，而用例照绿。
      #   所以必须全仓 0 error 才放行，不能靠人记得跑。
      - name: 静态检查（ruff：F,E9，阻断）
        run: python -m ruff check --select F,E9 .

      - name: 凭据扫描（仓库自带的钩子脚本，防 key 进历史）
        run: python scripts/check_no_secrets.py --once

      # ★ 仓库自己的运行器，CI 与本机共用同一套口径（逐用例循环、跳过语义、覆盖率、
      #   虚拟屏分辨率）。Windows 自带桌面会话，run_tests.py 按平台判断不挂 xvfb；
      #   --require-tk / --require-xvfb 保证缺依赖时判红，绝不静默少跑一批 GUI 用例
      #   （Windows 无 xvfb，--require-xvfb 在非 Linux 上是空操作 → 两个 job 命令一致）。
      #   覆盖率与测试同一次跑里累积（内部 `coverage run -a` + 末尾非阻断摘要）。
      - name: 跑全部离线测试（run_tests.py，累积覆盖率）
        env:
          # 测试期不起 git 子进程：Windows 上 `git describe` + 管道 + timeout 会卡死
          # （实测：整个 job 从早期就异常慢、最终卡在某个 GUI 用例），见 vlt/version.py。
          VLT_VERSION_NO_GIT: "1"
        run: python scripts/run_tests.py --coverage --require-tk --require-xvfb

  package:
    # 能过测试还不代表打得出来 —— 打包链路（PyInstaller + 资源 + 图标）单独验一次
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install "pyinstaller>=6.6"

      # ★ 同 tests job：打包前先确认发布用得到的两条腿真的装上了
      - name: 断言 Windows 独占依赖可导入
        run: python -c "import openvr, pyaudiowpatch; print('Windows 独占依赖 OK')"

      - name: 打包（跳过需要真 key 的自检）
        run: python scripts/build_exe.py --no-verify

      - name: 断言产物可用
        shell: pwsh
        run: |
          $exe = "dist/VRChatLiveTranslate.exe"
          if (-not (Test-Path $exe)) { Write-Error "没产出 exe"; exit 1 }
          $len = (Get-Item $exe).Length
          Write-Host ("打包成功：{0:N1} MB" -f ($len / 1MB))
          if ($len -lt 20MB) { Write-Error "体积异常，打包不完整"; exit 1 }

      # ★ 平台隔离断言：Windows 产物里不允许出现 Linux 独占实现
      #   （PipeWire 采集/虚拟声卡、自建 OpenXR 手腕屏）。判据是解包后的字节码，
      #   不是搜 exe 原始字节 —— PYZ 是 zlib 压缩的，直接搜永远搜不到。
      #   这条要求不能靠人记，所以做成了红灯门禁，见 docs/平台约束记录.md 第三节。
      - name: 断言平台隔离（不含 Linux 独占实现）
        run: python scripts/check_platform_purity.py dist/VRChatLiveTranslate.exe --platform windows

  # ------------------------------------------------------------------
  # Linux 侧：跑同一批离线测试。
  #
  # ⚠️ 与 Windows job 的三个关键差异（都写在下面的步骤里）：
  #   1) GitHub 的 ubuntu runner **没有显示器** —— 界面测试（Tk）必须挂在 xvfb 下跑，
  #      否则 tkinter 起不了窗口直接失败（Windows runner 自带桌面会话，所以那边不用）。
  #   2) 必须装**中日韩字体** —— 离线渲染手腕屏贴图要走 fontconfig 找字体，
  #      缺了会让 test_wrap / test_i18n 红（本项目在 Linux 上实测踩过这个）。
  #   3) 这里**不会**有 PipeWire、OpenXR 运行时、音频设备、API key ——
  #      对应代码必须走优雅降级分支。为此 `vlt/` 里有结构性防呆
  #      （`_test_process_guard()`：测试进程拒绝声明虚拟声卡 / 拒绝建 OpenXR 会话），
  #      所以跑测试**绝不会**去碰宿主的音频图或 XR 运行时。
  linux-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 装系统依赖
        run: |
          sudo apt-get update
          # xvfb        —— 无显示器下给 Tk 一个虚拟 X
          # fonts-noto-cjk —— 离线渲染中日韩贴图要 fontconfig 能找到字体
          # tk          —— tkinter 的运行时（setup-python 的解释器不一定自带 _tkinter）
          # libegl1 / libwayland-client0 —— 手腕屏后端 import 期就需要（真建会话会被防呆拦住）
          # xdotool / imagemagick / picom —— X11 原生叠加窗测试（真指针 / 截图 / 合成）
          # fonts-thai-tlwg —— 泰语用例需要「含泰文字形的字体」；CJK 字体（fonts-noto-cjk）
          #                    不含泰文，缺了它 tests/test_thai_font.py 只能整组跳过
          # fonts-unfonts-core —— 韩语用例需要「含韩文字形的字体」。⚠️ 这里刻意装一份**韩文专用**
          #                    字体：fonts-noto-cjk 是 pan-CJK 族、自带韩文，只装它的话
          #                    「韩文换了字体」这件事在 Linux 上不可观测（test_korean_font.py
          #                    会把相关断言判为跳过），装了 un 字体两条口径都能落地。
          # ⚠️ 不装 libportaudio2：2026-10 起 Linux 全程走 PipeWire 的 `pw-*` 子进程，
          #    sounddevice/PortAudio 已是 Windows 独占（见 requirements-linux.txt）。
          sudo apt-get install -y --no-install-recommends \
            xvfb fonts-noto-cjk fonts-thai-tlwg fonts-unfonts-core tk libegl1 libwayland-client0 \
            xdotool imagemagick picom

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-linux.txt
          python -m pip install -r requirements-dev.txt

      - name: 语法检查（不导入，只编译）
        run: python -m compileall -q vlt scripts tests

      # ★ 静态检查门禁（同 Windows job，**阻断**）：规则见 ruff.toml。
      - name: 静态检查（ruff：F,E9，阻断）
        run: python -m ruff check --select F,E9 .

      - name: 凭据扫描
        run: python scripts/check_no_secrets.py --once

      - name: 检查文档链接
        run: python scripts/check_doc_links.py

      # ★ 与 Windows job 同一条命令：仓库自己的运行器（CI 与本机共用一套口径 —— 逐用例
      #   循环、跳过语义、覆盖率、虚拟屏分辨率都只在这一处维护）。
      #   逐用例挂 `xvfb-run -a`；虚拟屏分辨率在 run_tests.py 里**显式钉死**，不依赖发行版
      #   默认（否则 Arch 640x480 / Ubuntu 1280x1024 各跑各的，几何用例口径不一致）。
      #   --require-tk / --require-xvfb 保证缺 tkinter / 缺 xvfb-run 时判红，而不是裸跑让
      #   GUI 用例自跳过造成假绿。
      #   覆盖率与测试同一次跑里累积（内部 `coverage run -a` + 末尾非阻断摘要）。
      - name: 跑离线测试（run_tests.py，累积覆盖率）
        env:
          VLT_VERSION_NO_GIT: "1"     # 与 Windows job 一致：测试期不起 git（见 vlt/version.py）
        run: python scripts/run_tests.py --coverage --require-tk --require-xvfb

  # ------------------------------------------------------------------
  # Linux AppImage：构建 + **独立验收**。
  #
  # 步骤本体在 **[appimage.yml](appimage.yml)**（可复用 workflow）—— 因为打 tag 发布时
  # 要用**同一份**（release.yml 也是 `uses:` 它）。构建口径只留一处：这边的系统依赖清单、
  # Tcl/Tk 版本进 cache key、构建→验收的顺序，抄第二份迟早只改一处（#12 的教训）。
  # 这里只保留「CI 里怎么排」：先跑完 Linux 测试，再构建 AppImage，失败即红灯。
  appimage:
    needs: linux-tests
    uses: ./.github/workflows/appimage.yml
